<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product Catalog - Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Product Catalog</h1>
    </header>

    <section class="controls">
      <div class="search">
        <input id="searchInput" type="search" placeholder="Search products by name...">
        <button id="searchBtn">Search</button>
      </div>

      <form id="addForm" class="add-form">
        <input id="name" name="name" placeholder="Name" required>
        <input id="category" name="category" placeholder="Category" required>
        <input id="price" name="price" placeholder="Price" type="number" step="0.01" required>
        <button type="submit">Add Product</button>
      </form>
    </section>

    <section class="content">
      <div id="status" class="status hidden"></div>

      <table class="products" aria-label="Products table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="productsBody">
          <!-- rows -->
        </tbody>
      </table>

      <div class="pagination">
        <button id="prevBtn">Previous</button>
        <span id="pageInfo"></span>
        <button id="nextBtn">Next</button>
      </div>
    </section>

    <footer>
      <small>Prototype using mocked API. Replace mock with real API calls later.</small>
    </footer>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
